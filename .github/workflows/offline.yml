name: Offline validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install development-only host runtime
        run: python -m pip install -r requirements-dev.txt
      - name: Audit public source and validate standalone
        run: |
          python scripts/check_repository.py
          python scripts/validate.py
      - name: Check out pinned first-party Power source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: B47ANCE/B47ANCEDPower
          ref: 40ff9ebfe247d56d7dd2e308e7b7eabfb61a7ce0
          path: _ci_dependencies/B47ANCEDPower
          persist-credentials: false
      - name: Validate actual-source Power integration
        run: python scripts/run_lua_tests.py --power-root _ci_dependencies/B47ANCEDPower
